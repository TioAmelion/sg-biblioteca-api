server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/biblioteca
    username: spring
    password: spring
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        format_sql: true
        open-in-view: false

  flyway:
    enabled: true
    schemas: biblioteca
    repair-on-migrate: true