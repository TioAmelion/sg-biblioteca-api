name: CI - Biblioteca API

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    # Cria um container MySQL temporário para os testes para passar no step do test da app
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: biblioteca
          MYSQL_ROOT_PASSWORD: biblioteca
          MYSQL_USER: spring
          MYSQL_PASSWORD: spring

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -pbiblioteca"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Executar testes
        run: ./mvnw clean test -Dspring.profiles.active=test

      - name: Gerar aplicação
        run: ./mvnw clean package -DskipTests -Dspring.profiles.active=test

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir imagem Docker
        # run: docker build -t biblioteca-api:latest . "-t" define o nome da imagem e "." usa o dir atual
        run: |
          docker build \
          -t ghcr.io/${{ lowercase(github.repository) }}:latest \
          .

      - name: Publicar imagem no GHCR
        run: | 
          docker push ghcr.io/${{ lowercase(github.repository) }}:latest
